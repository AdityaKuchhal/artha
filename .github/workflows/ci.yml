name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend — lint + typecheck + test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install ruff mypy pytest pytest-asyncio httpx

      - name: Ruff lint
        run: ruff check backend/

      - name: Ruff format check
        run: ruff format --check backend/

      - name: Mypy type check
        run: mypy backend/ --ignore-missing-imports
        continue-on-error: true  # warn only until type coverage improves

      - name: Pytest
        run: python -m pytest backend/tests/ -v --tb=short
        env:
          SUPABASE_URL: https://placeholder.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: placeholder
          SUPABASE_ANON_KEY: placeholder
          PLAID_CLIENT_ID: placeholder
          PLAID_SECRET: placeholder
          PLAID_ENV: sandbox
          ANTHROPIC_API_KEY: placeholder
          INTERNAL_SECRET: placeholder

  frontend:
    name: Frontend — lint + typecheck + test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: ESLint
        run: cd frontend && npx eslint . --ext .ts,.tsx --max-warnings 0
        continue-on-error: true  # warn only until lint errors are cleaned

      - name: TypeScript typecheck
        run: cd frontend && npx tsc --noEmit

      - name: Vitest
        run: cd frontend && npm test
