repos:
  # Python — ruff lint + format
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # General hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: detect-private-key

  # TypeScript/JS — eslint + prettier via local tools
  - repo: local
    hooks:
      - id: eslint
        name: ESLint
        entry: bash -c 'cd frontend && npx eslint . --ext .ts,.tsx --max-warnings 10'
        language: system
        pass_filenames: false
        files: ^frontend/.*\.(ts|tsx)$

      - id: prettier
        name: Prettier
        entry: bash -c 'cd frontend && npx prettier --check .'
        language: system
        pass_filenames: false
        files: ^frontend/.*\.(ts|tsx|css|json)$
